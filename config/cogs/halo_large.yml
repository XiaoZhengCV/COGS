_base_: [default.yml]

train_dataloader: 
  dataset: 
    transform:
      - shuffle
      - attr_normalize
      - random_rotate
      - random_scale
      - random_shift
      - random_dropout
      - random_jitter
      - sh2rgb
      - q2angle

val_dataloader: &val_dataloader
  dataset:
    transform:
      - attr_normalize
      - sh2rgb
      - q2angle
test_dataloader: *val_dataloader


# Model
model:
  backbone:
    type: HALO
    out_channels: [256, 512, 1024]
    group_channels: [64, 32, 32]
    k_neighbors: [20, 20, 20]
    n_points: [1024, 256, 64]
    ratio: 0.5
    emb_dims: 2048

resume: false
load_from: 